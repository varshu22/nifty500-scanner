name: Nifty 500 Daily Scan

on:
  schedule:
    - cron: '15 4 * * 1-5'    # 9:45 AM IST
    - cron: '50 7 * * 1-5'    # 1:20 PM IST
    - cron: '0 12 * * 1-5'    # 5:30 PM IST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty 500 scanner
        run: python scripts/nifty500_daily.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "data: nifty500 scan $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')"
          # Pull-rebase to handle case where main moved ahead since checkout
          git pull --rebase origin main
          git push
      - name: Keep workflow alive
        if: github.event_name == 'schedule'
        run: |
          mkdir -p .github
          echo "Last scheduled run: $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')" > .github/last-run.txt
          git add .github/last-run.txt
          git diff --staged --quiet || {
            git commit -m "heartbeat: scheduled run $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          }
